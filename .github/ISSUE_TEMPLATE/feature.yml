name: Feature proposal
description: Propose a change with a concrete failure mode or workflow need
title: "[proposal] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User/workflow problem
      description: What cannot be done safely or clearly today?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or example
      description: Prefer synthetic examples and reproducible cases.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed change
      description: How does this preserve Markdown as the source of truth?
    validations:
      required: true
