version: 2
updates:
  # Runtime has no dependencies; this keeps the uv.lock-pinned contributor
  # tooling and the optional MCP extra current.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Let a new release age before proposing it, so a compromised upload has
    # time to be yanked first.
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The Explorer is optional and its CI job is non-blocking. Group minor and
  # patch updates. Leave each major bump in its own pull request.
  - package-ecosystem: npm
    directory: /apps/explorer
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    # TypeScript stays on 5.9 until the toolchain is migrated deliberately.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      explorer-minor-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
