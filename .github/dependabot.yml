version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # The Explorer is optional and its CI job is non-blocking. Group minor and
  # patch updates. Leave each major bump in its own pull request.
  - package-ecosystem: npm
    directory: /apps/explorer
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      explorer-minor-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
