name: Decision diff

# Keep the PR write token out of CI reused by releases.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decision-diff:
    name: Decision diff comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same-repository pull requests only: a fork's token cannot write, and
    # this job must never run with a write token on a fork's code.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./
        with:
          root: examples/northline
          history: "false"
          today: "2026-09-17"
          comment: "true"
