name: MCP Registry

# Publishes server.json to the official MCP Registry after the matching
# package version is live on PyPI; the registry verifies ownership through the
# `mcp-name` line in that version's README. Manual, from main only, and it
# never touches PyPI or the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish server.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # OIDC login for the io.github.cometweb-io namespace
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that server.json matches a released version
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')"
          package="$(python3 -c 'import re; print(re.search(r"^__version__ = \"([^\"]+)\"", open("src/whykit/__init__.py").read(), re.M).group(1))')"
          test "$version" = "$package"
          curl --fail --silent --show-error --output /dev/null "https://pypi.org/pypi/whykit/$version/json"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
