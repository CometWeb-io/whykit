name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Build and verify without any publishing credential, in the same job that
  # every pull request runs as a dry run. The publish job below holds the OIDC
  # token, and it only ever sees the archives checked there.
  build:
    needs: quality
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
    with:
      release: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing; no API token stored in the repo.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PEP 740 attestations, signed with this workflow's OIDC identity,
          # are published next to each file on PyPI.
          attestations: true
