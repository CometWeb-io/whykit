name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow reuses the same gates against the exact tagged commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Tests and vault checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the package
        run: uv sync --locked --no-dev
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v
      - name: Lint the tiny example vault strictly
        run: uv run whykit lint examples/tiny --strict --today 2026-09-17
      - name: Lint the example vault strictly
        # Pinned as-of date: review dates in the example are fixed, so the run
        # stays reproducible instead of failing once those dates pass.
        run: uv run whykit lint examples/northline --strict --today 2026-09-17
      - name: Run the CI policy profile
        run: uv run whykit check --root examples/northline --profile ci --today 2026-09-17
      - name: Exercise the release policy profile
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$(bash scripts/release-baseline.sh)"
          uv run whykit check --root examples/northline --profile release --base "$base" --today 2026-09-17
      - name: Exercise versioned machine contracts
        run: |
          uv run whykit query "HubSpot" --root examples/northline --json > "$RUNNER_TEMP/query.json"
          uv run whykit context D-007 --root examples/northline --no-body --json > "$RUNNER_TEMP/context.json"
          uv run whykit pack D-007 --query "HubSpot" --root examples/northline --max-chars 4000 > "$RUNNER_TEMP/pack.json"
          uv run whykit graph --root examples/northline --format json > "$RUNNER_TEMP/graph.json"
          # --output is resolved relative to the vault root, not the process cwd.
          uv run whykit snapshot --root examples/northline --today 2026-09-17 --output .whykit/ci-snapshot.json
          uv run whykit verify-snapshot .whykit/ci-snapshot.json --root examples/northline --today 2026-09-17 --json
          rm -rf examples/northline/.whykit
      - name: A fresh vault must lint clean
        run: |
          uv run whykit init "$RUNNER_TEMP/fresh-vault"
          test -d "$RUNNER_TEMP/fresh-vault/00-context"
          test -d "$RUNNER_TEMP/fresh-vault/06-decisions"
          test -d "$RUNNER_TEMP/fresh-vault/notes"
          test ! -d "$RUNNER_TEMP/fresh-vault/01-strategy"
          # Warnings are expected and intended: the unanswered AGENTS.md
          # questions every adopter has to answer. Errors are not.
          uv run whykit lint --root "$RUNNER_TEMP/fresh-vault"
          uv run whykit check --root "$RUNNER_TEMP/fresh-vault" --profile local
          set +e
          uv run whykit check --root "$RUNNER_TEMP/fresh-vault" --profile ci
          check_status=$?
          set -e
          if [ "$check_status" -ne 1 ]; then
            echo "fresh vault CI gate returned $check_status; expected policy-failure exit 1" >&2
            exit 1
          fi
          uv run whykit lint --root "$RUNNER_TEMP/fresh-vault" --json > "$RUNNER_TEMP/fresh-vault-lint.json"
          uv run python - "$RUNNER_TEMP/fresh-vault-lint.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          codes = {finding["code"] for finding in report["findings"]}
          if (
              report["errors"] != 0
              or report["warnings"] != len(report["findings"])
              or codes != {"agents.unconfigured"}
          ):
              raise SystemExit("fresh vault must have no lint errors and must fail only because its agent contract is unconfigured")
          PY
          uv run whykit init --full "$RUNNER_TEMP/fresh-full"
          test -d "$RUNNER_TEMP/fresh-full/00-context"
          test -d "$RUNNER_TEMP/fresh-full/01-strategy"
          test -d "$RUNNER_TEMP/fresh-full/07-research"
          uv run whykit lint --root "$RUNNER_TEMP/fresh-full"
          uv run whykit init --minimal "$RUNNER_TEMP/fresh-minimal"
          test ! -d "$RUNNER_TEMP/fresh-minimal/01-strategy"
          uv run whykit lint --root "$RUNNER_TEMP/fresh-minimal"

  static:
    name: Lint, types and workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Install the pinned development tools
        run: uv sync --locked --only-group dev
      - name: Ruff
        run: uv run --no-sync ruff check --output-format=github
      - name: Mypy
        run: uv run --no-sync mypy
      - name: Audit workflows and the composite Action
        # Offline audits need no token. Configuration: .github/zizmor.yml.
        run: uv run --no-sync zizmor --offline --format=github .

  action:
    name: Composite Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull requests exercise the default history gate, which needs it.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Legacy mode on the tiny example
        id: tiny
        uses: ./
        with:
          root: examples/tiny
          strict: "true"
          today: "2026-09-17"
      - name: Profile mode on the Northline example
        id: northline
        uses: ./
        with:
          root: examples/northline
          profile: ci
          history: "false"
          today: "2026-09-17"
      - name: The version output matches the package
        shell: bash
        env:
          TINY_VERSION: ${{ steps.tiny.outputs.version }}
          NORTHLINE_VERSION: ${{ steps.northline.outputs.version }}
        run: |
          set -euo pipefail
          expected="$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/whykit/__init__.py').read_text()).group(1))")"
          for actual in "$TINY_VERSION" "$NORTHLINE_VERSION"; do
            if [ "$actual" != "$expected" ]; then
              echo "version output '$actual' does not match __version__ '$expected'" >&2
              exit 1
            fi
          done
          if python -c "import whykit" 2>/dev/null; then
            echo "the Action leaked WhyKit into the caller's Python environment" >&2
            exit 1
          fi
      - name: Prepare a vault with a broken wikilink
        shell: bash
        run: |
          set -euo pipefail
          cp -R examples/tiny "$RUNNER_TEMP/broken"
          printf '\n[[does-not-exist]]\n' >> "$RUNNER_TEMP/broken/Home.md"
          mv "$RUNNER_TEMP/broken" .action-broken-vault
      - name: A vault with lint errors must fail the Action
        id: broken
        continue-on-error: true
        uses: ./
        with:
          root: .action-broken-vault
          history: "false"
      - name: An invalid input must fail the Action
        id: bad-input
        continue-on-error: true
        uses: ./
        with:
          root: examples/tiny
          strict: "maybe"
      - name: An invalid date must fail the Action
        id: bad-today
        continue-on-error: true
        uses: ./
        with:
          root: examples/tiny
          today: "17/09/2026"
      - name: Failure cases failed
        shell: bash
        env:
          BROKEN: ${{ steps.broken.outcome }}
          BAD_INPUT: ${{ steps.bad-input.outcome }}
          BAD_TODAY: ${{ steps.bad-today.outcome }}
        run: |
          set -euo pipefail
          for outcome in "$BROKEN" "$BAD_INPUT" "$BAD_TODAY"; do
            if [ "$outcome" != "failure" ]; then
              echo "expected the Action to fail, got '$outcome'" >&2
              exit 1
            fi
          done

  package:
    name: MCP SDK and wheel/source distribution smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
      - name: Install and exercise the optional MCP server against the SDK
        run: |
          uv sync --locked --no-dev --extra mcp
          uv run python -m unittest discover -s tests -p 'test_mcp_runtime.py' -v
      - name: Negotiate both protocol eras on the lowest and highest allowed MCP SDK
        run: |
          set -euo pipefail
          for version in 2.2.0 2.3.0; do
            uv run --no-sync --with "mcp==$version" python -m unittest discover -s tests -p 'test_mcp_handshake.py' -v
            uv run --no-sync --with "mcp==$version" python -m unittest discover -s tests -p 'test_mcp_frames.py' -v
          done
      - name: Build twice from the same commit
        # SOURCE_DATE_EPOCH pins archive timestamps to the commit, so two
        # builds of one commit must be byte-identical. The release workflow
        # builds the same way; see docs/releasing.md.
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv build --out-dir dist
          uv build --out-dir "$RUNNER_TEMP/dist-rebuild"
      - name: Check the distributions against the packaging invariants
        # Version, py.typed, template completeness, PEP 639 licensing, zero
        # runtime dependencies, PyPI-safe README links, sdist allowlist, and
        # byte-identical rebuilds.
        run: python3 scripts/check_dist.py dist --reproducible-against "$RUNNER_TEMP/dist-rebuild"
      - name: Check distribution metadata renders on PyPI
        run: uv run --locked --only-group dist twine check --strict dist/*
      - name: Install and smoke-test the wheel on the lowest supported Python
        run: |
          set -euo pipefail
          uv venv --python "3.11" "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/whykit" --version
          "$RUNNER_TEMP/wheel-venv/bin/whykit" init packaged-wheel-vault
          cd packaged-wheel-vault
          "$RUNNER_TEMP/wheel-venv/bin/whykit" lint
          "$RUNNER_TEMP/wheel-venv/bin/whykit" doctor
      - name: Install and smoke-test the source distribution in a clean environment
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/sdist-venv"
          uv pip install --python "$RUNNER_TEMP/sdist-venv/bin/python" dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-venv/bin/whykit" --version
          "$RUNNER_TEMP/sdist-venv/bin/whykit" init packaged-sdist-vault
          cd packaged-sdist-vault
          "$RUNNER_TEMP/sdist-venv/bin/whykit" lint
          "$RUNNER_TEMP/sdist-venv/bin/whykit" doctor
      - name: Generate a CycloneDX SBOM of the clean wheel install
        # The core package has no runtime dependencies; the SBOM documents that
        # and check_dist.py fails if anything else appears in it.
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv run --locked --only-group dist cyclonedx-py environment \
            --sv 1.6 --output-reproducible --of JSON \
            -o "$RUNNER_TEMP/whykit.cdx.json" "$RUNNER_TEMP/wheel-venv/bin/python"
          python3 scripts/check_dist.py dist --sbom "$RUNNER_TEMP/whykit.cdx.json"
          cp "$RUNNER_TEMP/whykit.cdx.json" dist/
      - name: Keep the checked distributions and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  windows-portability:
    name: Windows portability (Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
      - name: Install the package
        run: uv sync --locked --no-dev
      - name: Unit tests, including the Windows mutation-lock implementation
        run: uv run python -m unittest discover -s tests -v
      - name: Lint the tiny example vault strictly
        run: uv run whykit lint examples/tiny --strict --today 2026-09-17
      - name: Lint the Northline example vault strictly
        run: uv run whykit lint examples/northline --strict --today 2026-09-17
      - name: Run the CI policy profile
        run: uv run whykit check --root examples/northline --profile ci --today 2026-09-17
      - name: Report on the runner's legacy code page without crashing
        # PYTHONUTF8=0 keeps stdout on the ANSI code page (cp1252), which has
        # no Ł or arrow. Human output must degrade; JSON must stay UTF-8.
        shell: bash
        env:
          PYTHONUTF8: "0"
        run: |
          set -uo pipefail
          vault="$RUNNER_TEMP/codepage-vault"
          cp -R examples/tiny "$vault"
          printf '\n- [[\xc5\x81\xc3\xb3d\xc5\xba \xe2\x86\x92 caf\xc3\xa9]]\n' >> "$vault/Home.md"
          # Actions runs bash with -e; lint exits 1 on purpose here, so capture it.
          status=0
          uv run whykit lint --root "$vault" > "$RUNNER_TEMP/human.txt" 2> "$RUNNER_TEMP/human.err" || status=$?
          if [ "$status" -ne 1 ] || grep -q Traceback "$RUNNER_TEMP/human.err"; then
            cat "$RUNNER_TEMP/human.txt" "$RUNNER_TEMP/human.err"
            echo "human lint output must report the broken link (exit 1), not crash" >&2
            exit 1
          fi
          uv run whykit lint --root "$vault" --json > "$RUNNER_TEMP/lint.json" || [ $? -eq 1 ]
          uv run python - "$RUNNER_TEMP/lint.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_bytes().decode("utf-8"))
          if "[[Łódź → café]]" not in report["findings"][0]["message"]:
              raise SystemExit("JSON output was not UTF-8 on a legacy code page")
          PY

  decision-history:
    name: Decision and review history is append-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          uv run whykit history \
            --base "$PR_BASE_SHA" --head HEAD \
            --root examples/northline

  decision-diff:
    name: Decision diff comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same-repository pull requests only: a fork's token cannot write, and
    # this job must never run with a write token on a fork's code.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./
        with:
          root: examples/northline
          history: "false"
          today: "2026-09-17"
          comment: "true"

  pre-commit-hooks:
    name: pre-commit hooks install and run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
      - name: Install the pre-commit framework
        run: uv sync --locked --only-group hooks
      - name: The hooks in .pre-commit-hooks.yaml install and gate a vault
        env:
          WHYKIT_REQUIRE_PRE_COMMIT: "1"
        run: uv run --no-sync python -m unittest discover -s tests -p test_ci_integrations.py -k PreCommitTryRepoTests -v

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        # The gitleaks *binary* is MIT and free everywhere. The official Action
        # requires a paid licence key for organisation-owned repositories, which
        # would break this job the day the repo moves under an org.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          # Verbose findings include commit author/email metadata; keep PII out
          # of retained Actions logs. Maintainers can reproduce locally with -v.
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
      - name: Reject AI-tool commit identities and attribution trailers
        run: python3 scripts/check_commit_attribution.py

  explorer:
    name: Explorer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/explorer/package-lock.json
      - run: uv sync --locked --no-dev
      - run: npm ci --prefix apps/explorer
      - name: Build from the Markdown example vault
        run: npm run check --prefix apps/explorer

  explorer-e2e:
    name: Explorer end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/explorer/package-lock.json
      - run: npm ci --prefix apps/explorer
      - name: Install Playwright's bundled Chromium
        working-directory: apps/explorer
        run: npx playwright install --with-deps chromium
      - name: Run the end-to-end suite against static builds
        working-directory: apps/explorer
        env:
          CI: "true"
        run: npm run e2e
