name: Bug report
description: Reproducible WhyKit core or Explorer defect
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What behavior is wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic/non-sensitive content. Never attach a real private vault.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Verification output
      description: Include relevant `whykit lint` / test output, with secrets removed.
