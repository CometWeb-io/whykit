name: WhyKit
description: Check an evidence and decision ledger, including repository policy and append-only history.
author: CometWeb
branding:
  icon: book-open
  color: gray-dark

inputs:
  root:
    description: Vault root, relative to the repository.
    required: false
    default: "."
  profile:
    description: >
      Optional WhyKit policy profile from whykit.toml (for example ci or release).
      When empty, the Action keeps the legacy lint + history behavior.
    required: false
    default: ""
  strict:
    description: >
      Legacy lint-mode input. Treat warnings as failures when profile is empty.
      Prefer profile: ci for repository-local policy.
    required: false
    default: "false"
  base:
    description: >
      Optional Git baseline passed to `whykit check --base` in profile mode.
      Pull requests automatically use the PR base SHA when this is empty and history is enabled.
    required: false
    default: ""
  history:
    description: >
      On a pull request, verify that accepted decision reasoning and prior review
      events were not rewritten. Requires fetch-depth 0 on actions/checkout.
      When profile is set, the PR base is passed into `whykit check`.
    required: false
    default: "true"
  today:
    description: >
      Optional ISO date (YYYY-MM-DD) passed as `--today`, so review-date checks
      are evaluated as of a fixed day instead of the runner clock. Useful for
      example or archived vaults whose review dates are expected to pass. When
      empty, the current date is used.
    required: false
    default: ""
  annotations:
    description: >
      Print lint findings and failed gate checks as GitHub workflow annotations
      (`--format github`), so they appear inline on the pull request diff.
    required: false
    default: "false"
  sarif:
    description: >
      Also export every lint finding as SARIF 2.1.0 (`whykit lint --format sarif`)
      and upload it to code scanning with github/codeql-action/upload-sarif.
      The calling job needs `security-events: write` (plus `actions: read` and
      `contents: read` in a private repository). Runs before the gate, so the
      report is uploaded even when the gate then fails.
    required: false
    default: "false"

outputs:
  sarif-file:
    description: >
      Path of the SARIF report when `sarif` is "true" (for example to keep it
      with actions/upload-artifact); empty otherwise.
    value: ${{ steps.sarif.outputs.file }}
  version:
    description: >
      The WhyKit version the Action installed and ran, as printed by
      `whykit --version` (for example `0.3.0`).
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install the exact WhyKit action revision
      id: install
      shell: bash
      env:
        WHYKIT_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # An isolated virtual environment: the runner's system Python may be
        # externally managed (PEP 668), and installing into whichever Python the
        # caller set up would leak this package into their later steps.
        python=""
        for candidate in python3 python; do
          # Executing the candidate also skips the Windows Store alias stub.
          if "$candidate" -c 'import sys; sys.exit(sys.version_info < (3, 11))' >/dev/null 2>&1; then
            python="$candidate"
            break
          fi
        done
        if [ -z "$python" ]; then
          echo "::error::WhyKit needs Python 3.11 or newer on PATH; add actions/setup-python before this step"
          exit 2
        fi
        venv="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/whykit-action.XXXXXX")"
        "$python" -m venv "$venv"
        venv_python="$venv/bin/python"
        if [ ! -x "$venv_python" ]; then
          venv_python="$venv/Scripts/python"
        fi
        "$venv_python" -m pip install --disable-pip-version-check --quiet "$WHYKIT_ACTION_PATH"
        scripts="$("$venv_python" -c 'import sysconfig; print(sysconfig.get_path("scripts"))')"
        if command -v cygpath >/dev/null 2>&1; then
          scripts="$(cygpath -u "$scripts")"
        fi
        whykit="$scripts/whykit"
        version="$("$whykit" --version)"
        version="${version#whykit }"
        echo "Installed WhyKit $version"
        {
          echo "whykit=$whykit"
          echo "version=$version"
        } >> "$GITHUB_OUTPUT"

    - name: Export lint findings as SARIF
      id: sarif
      if: inputs.sarif != 'false'
      shell: bash
      env:
        WHYKIT_ROOT: ${{ inputs.root }}
        WHYKIT_SARIF: ${{ inputs.sarif }}
        WHYKIT_TODAY: ${{ inputs.today }}
        WHYKIT: ${{ steps.install.outputs.whykit }}
      run: |
        set -euo pipefail
        if [ "$WHYKIT_SARIF" != "true" ]; then
          echo "::error::sarif must be 'true' or 'false'"
          exit 2
        fi
        args=("$WHYKIT" lint --root "$WHYKIT_ROOT" --format sarif)
        if [ -n "$WHYKIT_TODAY" ]; then
          if ! [[ "$WHYKIT_TODAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::today must be an ISO date (YYYY-MM-DD)"
            exit 2
          fi
          args+=(--today "$WHYKIT_TODAY")
        fi
        report="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/whykit.XXXXXX")"
        mv "$report" "$report.sarif"
        report="$report.sarif"
        # Exit 1 only means "there are findings"; the gate step decides
        # whether they fail the job. Exit 2 means no report was written.
        status=0
        "${args[@]}" > "$report" || status=$?
        if [ "$status" -gt 1 ]; then
          exit "$status"
        fi
        echo "file=$report" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to code scanning
      if: inputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ steps.sarif.outputs.file }}
        category: whykit:${{ inputs.root }}

    - name: Repository policy gate
      if: inputs.profile != ''
      shell: bash
      env:
        WHYKIT_ROOT: ${{ inputs.root }}
        WHYKIT_PROFILE: ${{ inputs.profile }}
        WHYKIT_HISTORY: ${{ inputs.history }}
        WHYKIT_BASE: ${{ inputs.base }}
        WHYKIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        WHYKIT_EVENT: ${{ github.event_name }}
        WHYKIT_TODAY: ${{ inputs.today }}
        WHYKIT_ANNOTATIONS: ${{ inputs.annotations }}
        WHYKIT: ${{ steps.install.outputs.whykit }}
      run: |
        set -euo pipefail
        case "$WHYKIT_HISTORY" in
          true|false) ;;
          *) echo "::error::history must be 'true' or 'false'"; exit 2 ;;
        esac
        args=("$WHYKIT" check --root "$WHYKIT_ROOT" --profile "$WHYKIT_PROFILE")
        case "$WHYKIT_ANNOTATIONS" in
          true) args+=(--format github) ;;
          false) ;;
          *) echo "::error::annotations must be 'true' or 'false'"; exit 2 ;;
        esac
        base="$WHYKIT_BASE"
        if [ -z "$base" ] && [ "$WHYKIT_HISTORY" = "true" ] && [ "$WHYKIT_EVENT" = "pull_request" ]; then
          base="$WHYKIT_BASE_SHA"
        fi
        if [ -n "$WHYKIT_TODAY" ]; then
          if ! [[ "$WHYKIT_TODAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::today must be an ISO date (YYYY-MM-DD)"
            exit 2
          fi
          args+=(--today "$WHYKIT_TODAY")
        fi
        if [ -n "$base" ]; then
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::error::History check requires actions/checkout with fetch-depth: 0"
            exit 2
          fi
          args+=(--base "$base" --head HEAD)
        fi
        "${args[@]}"

    - name: Lint the vault (legacy mode)
      if: inputs.profile == ''
      shell: bash
      env:
        WHYKIT_ROOT: ${{ inputs.root }}
        WHYKIT_STRICT: ${{ inputs.strict }}
        WHYKIT_TODAY: ${{ inputs.today }}
        WHYKIT_ANNOTATIONS: ${{ inputs.annotations }}
        WHYKIT: ${{ steps.install.outputs.whykit }}
      run: |
        set -euo pipefail
        args=("$WHYKIT" lint --root "$WHYKIT_ROOT")
        case "$WHYKIT_STRICT" in
          true) args+=(--strict) ;;
          false) ;;
          *) echo "::error::strict must be 'true' or 'false'"; exit 2 ;;
        esac
        case "$WHYKIT_ANNOTATIONS" in
          true) args+=(--format github) ;;
          false) ;;
          *) echo "::error::annotations must be 'true' or 'false'"; exit 2 ;;
        esac
        if [ -n "$WHYKIT_TODAY" ]; then
          if ! [[ "$WHYKIT_TODAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::today must be an ISO date (YYYY-MM-DD)"
            exit 2
          fi
          args+=(--today "$WHYKIT_TODAY")
        fi
        "${args[@]}"

    - name: Decision and review history is append-only (legacy mode)
      if: inputs.profile == '' && inputs.history == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        WHYKIT_ROOT: ${{ inputs.root }}
        WHYKIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        WHYKIT: ${{ steps.install.outputs.whykit }}
      run: |
        set -euo pipefail
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error::History check requires actions/checkout with fetch-depth: 0"
          exit 2
        fi
        "$WHYKIT" history \
          --base "$WHYKIT_BASE_SHA" \
          --head HEAD \
          --root "$WHYKIT_ROOT"
