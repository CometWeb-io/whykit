[build-system]
# Exact pins: the same commit must build the same bytes (see docs/releasing.md).
# hatchling >= 1.27 is required for PEP 639 License-Expression metadata.
# hatch-fancy-pypi-readme rewrites the README's relative links for PyPI; it is a
# build-time plugin only and never reaches the installed package.
requires = ["hatchling==1.32.4", "hatch-fancy-pypi-readme==25.1.0"]
build-backend = "hatchling.build"

[project]
name = "whykit"
dynamic = ["version", "readme"]
description = "Git-native evidence and decision ledger for teams and AI agents"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Maciej Zmitrukiewicz", email = "hello@cometweb.io" }]
maintainers = [{ name = "Maciej Zmitrukiewicz", email = "hello@cometweb.io" }]
keywords = [
  "decision-records", "adr", "decision-log", "evidence", "provenance",
  "audit-trail", "knowledge-base", "markdown", "git", "obsidian", "agents", "mcp",
]
# No "License ::" classifier: PEP 639 supersedes it with the `license`
# expression above, and PyPI rejects uploads that carry both.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

# Contributor tooling only; never installed with the package. Exact pins keep
# the gates reproducible, and uv.lock adds hashes. CI installs the core package
# with --no-dev, so none of this reaches the runtime dependency graph.
[dependency-groups]
dev = [
  "mypy==2.4.0",
  "ruff==0.16.10",
  "zizmor==1.30.1",
]
# Release-artifact tooling: distribution metadata check (`twine check`) and the
# CycloneDX SBOM generator (`cyclonedx-py`). Kept out of `dev` so a normal
# contributor sync stays small; CI's package job opts in with --only-group dist.
dist = [
  "cyclonedx-bom==7.5.0",
  "twine==7.0.0",
]

[project.urls]
Homepage = "https://github.com/CometWeb-io/whykit"
Documentation = "https://github.com/CometWeb-io/whykit#readme"
Source = "https://github.com/CometWeb-io/whykit"
Changelog = "https://github.com/CometWeb-io/whykit/blob/main/CHANGELOG.md"
Issues = "https://github.com/CometWeb-io/whykit/issues"
Security = "https://github.com/CometWeb-io/whykit/blob/main/SECURITY.md"

[project.scripts]
whykit = "whykit.cli:main"
whykit-mcp = "whykit.mcp_server:main"

[tool.hatch.version]
path = "src/whykit/__init__.py"

[tool.hatch.build.targets.wheel]
# The template ships inside the package, so `whykit init` works from a wheel
# with no checkout present. Do not add a force-include for it; `packages`
# already carries every file under src/whykit/.
packages = ["src/whykit"]

[tool.hatch.build.targets.sdist]
# The project test suite exercises checkout-only tooling and repository policy
# files. Keep it in GitHub source checkouts, not in the installable sdist.
# Patterns are gitignore-style: an unanchored "README.md" also matches
# scripts/README.md and docs/media/README.md, so every entry is anchored.
include = [
  "/src/whykit",
  "/schemas",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# PyPI renders the README outside the repository, where relative links and the
# overview image would 404. Rewrite them to absolute GitHub URLs; anchors (#...)
# and absolute URLs are left alone. Images go to raw content, links to the
# rendered GitHub view. scripts/check_dist.py fails the build if one slips by.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?![a-zA-Z][a-zA-Z0-9+.-]*:|#)([^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/CometWeb-io/whykit/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?<!!)\[([^\]]*)\]\((?![a-zA-Z][a-zA-Z0-9+.-]*:|#)([^)\s]+)\)'
replacement = '[\1](https://github.com/CometWeb-io/whykit/blob/main/\2)'

# Dev/CI use Astral uv. Runtime stays dependency-free; the lockfile pins the
# empty graph so `uv sync --locked` fails closed if someone adds a dependency
# without refreshing uv.lock.
[tool.uv]
package = true

[tool.ruff]
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["apps", "src/whykit/template", "examples"]

[tool.ruff.lint]
# Correctness-focused baseline. Long lines are a deliberate style here (prose
# messages, test fixtures), and import order is not enforced, to avoid a
# repository-wide churn commit. Tighten by adding rules with their fixes.
select = ["E", "F", "W", "B", "UP", "PLE"]
ignore = [
  "E501",   # line length: messages and fixtures are intentionally long
  "UP017",  # datetime.timezone.utc is kept for readability
]

[tool.ruff.lint.per-file-ignores]
# Baseline: typing.Iterable import predates the rule. Remove when touched.
"src/whykit/lint.py" = ["UP035"]

[tool.mypy]
python_version = "3.11"
files = ["src/whykit"]
warn_unused_configs = true
warn_redundant_casts = true
# The optional MCP SDK is not installed in the default dev environment.
[[tool.mypy.overrides]]
module = ["mcp.*", "mcp_types.*", "pydantic.*"]
ignore_missing_imports = true

# Baseline of findings that predate the type gate, narrowed to the exact error
# codes per module so a new kind of error in these modules still fails CI.
# Delete an entry when its module is fixed; never add one for new code.
[[tool.mypy.overrides]]
module = "whykit.lint"
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = "whykit.explorer_index"
disable_error_code = ["arg-type", "return-value", "dict-item", "assignment"]

[[tool.mypy.overrides]]
# msvcrt locking constants exist only in the Windows stub branch.
module = "whykit.io"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "whykit.graph"
disable_error_code = ["assignment", "arg-type"]

[[tool.mypy.overrides]]
module = "whykit.adopt"
disable_error_code = ["var-annotated"]

[[tool.mypy.overrides]]
module = "whykit.snapshot"
disable_error_code = ["arg-type"]
